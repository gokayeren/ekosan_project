<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Ekosan Panel - Giriş</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      body { background: radial-gradient(circle at 15% 15%, rgba(37,99,235,.18), transparent 32%), radial-gradient(circle at 85% 85%, rgba(14,165,233,.12), transparent 28%), #020617; }
      .login-card { box-shadow: 0 30px 80px rgba(0,0,0,.38); }
      .login-input:focus { box-shadow: 0 0 0 4px rgba(59,130,246,.1); }
      .login-button { box-shadow: 0 12px 30px rgba(37,99,235,.25); }
      .login-button:hover { transform: translateY(-1px); box-shadow: 0 16px 34px rgba(37,99,235,.32); }
    </style>
</head>
<body class="bg-[#020617] flex items-center justify-center min-h-screen p-4 font-sans text-slate-200">
    
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Ekosan" class="h-10 w-auto mx-auto mb-5 object-contain">
            <h1 class="text-2xl font-semibold text-slate-100 tracking-tight">Tekrar hoş geldiniz</h1>
            <p class="text-slate-500 mt-2 text-sm">Yönetim paneline güvenli giriş yapın</p>
        </div>

        <div class="login-card bg-[#0f172a]/95 backdrop-blur rounded-2xl border border-slate-800 overflow-hidden p-8 relative">
            
            <div class="flex justify-center mb-6">
                <div class="w-14 h-14 rounded-2xl border border-blue-500/20 bg-blue-500/10 flex items-center justify-center text-blue-400 shadow-inner">
                    <i class="fa fa-user-shield text-2xl"></i>
                </div>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="mb-6 px-4 py-3 rounded text-sm flex items-center gap-3
                      {% if category == 'danger' or category == 'error' %}
                          bg-red-500/10 border border-red-500/20 text-red-400
                      {% elif category == 'success' %}
                          bg-emerald-500/10 border border-emerald-500/20 text-emerald-400
                      {% else %}
                          bg-blue-500/10 border border-blue-500/20 text-blue-400
                      {% endif %}
                  ">
                      <i class="fa fa-exclamation-circle"></i>
                      <span>{{ message }}</span>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="">
                <div class="mb-5">
                    <label class="block text-sm font-medium text-slate-400 mb-2">Kullanıcı Adı</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                            <i class="fa fa-user"></i>
                        </div>
                        <input type="text" name="username" class="login-input w-full bg-[#020617] border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 transition-all" placeholder="Kullanıcı adınızı girin" required autofocus autocomplete="username">
                    </div>
                </div>
                
                <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-400 mb-2">Şifre</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                            <i class="fa fa-lock"></i>
                        </div>
                        <input type="password" name="password" class="login-input w-full bg-[#020617] border border-slate-700 rounded-xl pl-10 pr-4 py-3 text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 transition-all" placeholder="Şifrenizi girin" required autocomplete="current-password">
                    </div>
                </div>
                
                <button type="submit" class="login-button w-full flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl transition-all border-0 cursor-pointer">
                    <i class="fa fa-sign-in-alt"></i> Sisteme Giriş Yap
                </button>
            </form>
            
        </div>
        
        <div class="text-center mt-6 text-xs text-slate-600">
            &copy; 2026 Ekosan Mühendislik. Tüm hakları saklıdır.
        </div>
    </div>
</body>
</html>
